# Render Blueprint: creates the web service and a PostgreSQL database together.
# Docs: https://render.com/docs/blueprint-spec
databases:
  - name: redundancy-db
    plan: free
    databaseName: redundancy
    user: redundancy_user

services:
  - type: web
    name: codealpha-data-redundancy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Pre-deploy commands are a paid-plan feature on Render, so on the free plan
    # we apply migrations at start-up (safe: "db upgrade" is idempotent).
    startCommand: flask --app app db upgrade && gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: redundancy-db
          property: connectionString
